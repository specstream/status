# Upptime configuration for the public SpecStream status page.
# The repository github.com/specstream/status is made from the upptime/upptime template by
# ops/status-page/publish.sh, which copies this file there. Upptime's own GitHub Actions read it.
#
# Every check is signed out: no API key is stored in that repository and no check is billed.
# A route that asks for a key answers 401 when the service behind it is up, so 401 is the
# expected answer there. tests/ops/test_status_page.py holds these paths to the API's routes.
owner: specstream
repo: status

sites:
  - name: Search API
    url: https://api.specstream.ai/v1/web-search?q=status
    expectedStatusCodes:
      - 401
  - name: Extract API
    method: POST
    url: https://api.specstream.ai/v1/extract
    headers:
      - "Content-Type: application/json"
    body: '{"urls": ["https://example.com"]}'
    expectedStatusCodes:
      - 401
  - name: Deep Search API
    # Signed out this list answers 200 with no specs today; 401 is also a live answer.
    url: https://api.specstream.ai/v1/specs
    expectedStatusCodes:
      - 200
      - 401
  - name: MCP server
    method: POST
    url: https://api.specstream.ai/mcp
    headers:
      - "Content-Type: application/json"
      - "Accept: application/json, text/event-stream"
    body: '{"jsonrpc": "2.0", "id": 1, "method": "ping"}'
    expectedStatusCodes:
      - 401
  - name: API health
    url: https://api.specstream.ai/healthz
    expectedStatusCodes:
      - 200
  - name: Website
    url: https://specstream.ai/
    expectedStatusCodes:
      - 200

status-website:
  # Served by GitHub Pages at https://specstream.github.io/status/ (no custom domain, so no DNS step).
  baseUrl: /status
  # The logo is the launch kit's ink mark on white (listings/_shared/launch-kit.md, Logo and pictures).
  logoUrl: https://specstream.ai/logo/specstream-logo.svg
  favicon: https://specstream.ai/logo/specstream-logo-1024.png
  name: SpecStream Status
  # The two lines below wait for the writer agent (words a stranger reads).
  introTitle: "SpecStream status"
  introMessage: Live checks of the Search, Extract and Deep Search APIs, run every five minutes from GitHub Actions. Incidents are also listed at [api.specstream.ai/v1/status](https://api.specstream.ai/v1/status).
  navbar:
    - title: Status
      href: /
    - title: SpecStream
      href: https://specstream.ai/
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
